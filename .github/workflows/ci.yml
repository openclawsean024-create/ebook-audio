# GitHub Actions Workflow · ebook-audio
# Fleet template: 純靜態 HTML → GitHub Pages
# 2026-09-07 by Sean 10-repo-fleet Worker — v3.0.2

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_TARGET: pages

jobs:
  # ebook-audio 是純靜態 HTML，無需 npm build
  # dashboard.html 為主程式

  link-check:
    name: Link Check (static HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML files exist
        run: |
          echo "--- HTML 入口檢查 ---"
          for f in dashboard.html; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ MISSING: $f"
              exit 1
            fi
          done
      - name: Check internal links
        run: |
          echo "--- 內部連結檢查 ---"
          broken=0
          for f in *.html; do
            for link in $(grep -oE 'href="[^"]*\.html"' "$f" 2>/dev/null | tr -d '"' | sed 's/href=//'); do
              if [ ! -f "$link" ]; then
                echo "❌ $f → $link (NOT FOUND)"
                broken=$((broken + 1))
              fi
            done
          done
          if [ $broken -gt 0 ]; then
            echo "Found $broken broken links"
            exit 1
          fi
          echo "✅ All internal links valid"

  lint:
    name: Lint (no-op, 純 HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML basic sanity
        run: |
          echo "--- HTML sanity check ---"
          for f in *.html; do
            if grep -qi "<!doctype html>" "$f"; then
              echo "✅ $f has DOCTYPE"
            else
              echo "❌ $f missing DOCTYPE"
              exit 1
            fi
          done

  test:
    name: Test (no-op, 純前端)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke check
        run: |
          echo "--- 純靜態站，無單元測試 ---"
          echo "✅ ebook-audio 為純前端 HTML（無 build/test pipeline）"

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: [link-check, lint, test]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
